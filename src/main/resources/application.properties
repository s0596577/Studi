spring.application.name=studi
logging.level.root=warn
logging.level.htw.bakar.studi.controller=debug
logging.level.org.hibernate=error


# Lokale, per .gitignore ausgeschlossene Property-Datei mit echten Zugangsdaten (optional).
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studibackend_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}